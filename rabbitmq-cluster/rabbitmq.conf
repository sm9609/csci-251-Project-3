# RabbitMQ Configuration for Chaos Engineering Lab
# Shorter timeouts for easier observation of failures

# Cluster formation - nodes discover each other via DNS
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq-3

# Faster failure detection (default is 60s, we use 10s)
cluster_keepalive_interval = 10000
cluster_partition_handling = pause_minority

# Queue mirroring policy - will need to be set after cluster forms
# Run: rabbitmqctl set_policy ha-all ".*" '{"ha-mode":"all","ha-sync-mode":"automatic"}'
