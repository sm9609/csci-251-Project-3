  redis-6:
    image: redis:7-alpine
    container_name: redis-6
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    ports:
      - "6376:6379"
    networks:
      redis-net:
        ipv4_address: 172.28.0.16
    volumes:
      - redis-6-data:/data
    cap_add:
      - NET_ADMIN

networks:
  redis-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  redis-1-data:
  redis-2-data:
  redis-3-data:
  redis-4-data:
  redis-5-data:
  redis-6-data:
