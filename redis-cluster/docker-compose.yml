# Redis Cluster - 6 Node Configuration (3 masters + 3 replicas)
# For Chaos Engineering Lab - CS 480
#
# Key concepts to explore:
# - Automatic failover when master dies
# - Split-brain scenarios during network partitions
# - Replication lag and data loss windows
# - Cluster slot redistribution
#
# Start: docker-compose up -d
# Initialize cluster: docker exec redis-1 redis-cli --cluster create \
#   redis-1:6379 redis-2:6379 redis-3:6379 redis-4:6379 redis-5:6379 redis-6:6379 \
#   --cluster-replicas 1 --cluster-yes

services:
  redis-1:
    image: redis:7-alpine
    container_name: redis-1
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    ports:
      - "6371:6379"
    networks:
      redis-net:
        ipv4_address: 172.28.0.11
    volumes:
      - redis-1-data:/data
    cap_add:
      - NET_ADMIN  # Required for iptables/tc chaos injection

  redis-2:
    image: redis:7-alpine
    container_name: redis-2
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    ports:
      - "6372:6379"
    networks:
      redis-net:
        ipv4_address: 172.28.0.12
    volumes:
