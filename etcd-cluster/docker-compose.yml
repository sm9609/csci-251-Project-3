# etcd Cluster - 3 Node Configuration
# For Chaos Engineering Lab - CS 480
#
# Key concepts to explore:
# - Raft consensus algorithm in action
# - Leader election during failures
# - Quorum requirements (need 2/3 nodes for writes)
# - Linearizable vs serializable reads
# - Split-brain prevention via majority voting
#
# Start: docker-compose up -d
# Check cluster health: docker exec etcd-1 etcdctl endpoint health --cluster
# Check leader: docker exec etcd-1 etcdctl endpoint status --cluster -w table

services:
  etcd-1:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: etcd-1
    environment:
      - ETCD_NAME=etcd-1
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd-1:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd-1:2380
      - ETCD_INITIAL_CLUSTER=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_INITIAL_CLUSTER_TOKEN=etcd-cluster-chaos-lab
      # Shorter timeouts for faster failure detection (easier to observe)
      - ETCD_HEARTBEAT_INTERVAL=250
      - ETCD_ELECTION_TIMEOUT=1250
    ports:
      - "2379:2379"
      - "2380:2380"
    networks:
      etcd-net:
        ipv4_address: 172.29.0.11
    volumes:
      - etcd-1-data:/etcd-data
    cap_add:
      - NET_ADMIN  # Required for iptables/tc chaos injection

  etcd-2:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: etcd-2
    environment:
      - ETCD_NAME=etcd-2
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd-2:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd-2:2380
      - ETCD_INITIAL_CLUSTER=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_INITIAL_CLUSTER_TOKEN=etcd-cluster-chaos-lab
      - ETCD_HEARTBEAT_INTERVAL=250
      - ETCD_ELECTION_TIMEOUT=1250
    ports:
      - "2381:2379"
      - "2382:2380"
    networks:
      etcd-net:
        ipv4_address: 172.29.0.12
    volumes:
      - etcd-2-data:/etcd-data
    cap_add:
      - NET_ADMIN

  etcd-3:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: etcd-3
    environment:
      - ETCD_NAME=etcd-3
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd-3:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd-3:2380
      - ETCD_INITIAL_CLUSTER=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_INITIAL_CLUSTER_TOKEN=etcd-cluster-chaos-lab
      - ETCD_HEARTBEAT_INTERVAL=250
      - ETCD_ELECTION_TIMEOUT=1250
    ports:
      - "2383:2379"
      - "2384:2380"
    networks:
      etcd-net:
        ipv4_address: 172.29.0.13
    volumes:
      - etcd-3-data:/etcd-data
    cap_add:
      - NET_ADMIN

networks:
  etcd-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16

volumes:
  etcd-1-data:
  etcd-2-data:
  etcd-3-data:
